[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "enterprise-rag"
version = "0.1.0"
description = "Enterprise Modular Research-Paper RAG POC (Phase 1: Naive RAG baseline)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Enterprise RAG Team" }]
keywords = ["rag", "azure", "openai", "search", "retrieval"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "openai>=1.40",
  "azure-search-documents>=11.5.2",
  "azure-core>=1.30",
  "pypdf>=4.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
]
# Optional Entra ID (AAD) auth support for a future milestone. Not wired in Phase 1.
aad = ["azure-identity>=1.17"]

[project.scripts]
rag = "enterprise_rag.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/enterprise_rag"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4"]

[tool.ruff.lint.isort]
known-first-party = ["enterprise_rag"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
warn_return_any = false
ignore_missing_imports = false

# Third-party packages we wrap in infrastructure adapters. We do not rely on their
# types, and some ship stubs using syntax newer than our target python_version, so
# skip following them entirely.
[[tool.mypy.overrides]]
module = ["azure.*", "pypdf.*", "openai.*", "numpy.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
